<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AriaCast — Room Editor</title>
<style>
  :root {
    --bg: #0d1013; --panel: #171c22; --panel-2: #1e242b; --panel-3: #262e37; --border: #2a323b;
    --text: #e8edf2; --muted: #8b98a5; --muted-2: #5f6b78; --accent: #4fc3f7; --accent-2: #29b6f6;
    --online: #4caf50; --offline: #616161; --unavailable: #e53935; --grid: #1c2229;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --radius: 10px; --radius-lg: 16px;
  }

  * { box-sizing: border-box; }
  *::selection { background: var(--accent); color: #05222e; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79, 195, 247, 0.06), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(79, 195, 247, 0.04), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 999px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }
  * { scrollbar-width: thin; scrollbar-color: var(--panel-3) transparent; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  #layout {
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    height: 100vh;
    gap: 1px;
    background: var(--border);
  }

  .panel {
    background: var(--panel);
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
  }

  .panel h2 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 4px 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .room-item {
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid transparent;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .room-item:hover { background: var(--panel-2); border-color: var(--border); }
  .room-item:active { transform: scale(0.99); }
  .room-item.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #05222e;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(79, 195, 247, 0.25);
  }
  .room-item.active small { color: #05222e; }
  .room-item small { opacity: 0.7; font-weight: 500; font-size: 0.72rem; }
  .room-delete {
    padding: 2px 8px;
    margin-left: 6px;
    font-size: 0.9rem;
    line-height: 1;
    opacity: 0.6;
  }
  .room-delete:hover { opacity: 1; background: #e53935; color: #fff; border-color: #e53935; }

  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
  }
  button:hover { border-color: var(--accent); background: var(--panel-3); }
  button:active { transform: scale(0.97); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #05222e;
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(79, 195, 247, 0.2);
  }
  button.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }

  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 28px;
    background:
      radial-gradient(ellipse at center, rgba(255, 255, 255, 0.015), transparent 70%);
  }

  canvas {
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 40px), #0a0d10;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    cursor: crosshair;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    transition: box-shadow 0.2s ease;
  }
  canvas:hover { box-shadow: var(--shadow), 0 0 0 1px rgba(79, 195, 247, 0.15); }

  #empty-state {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--muted);
    text-align: center;
    pointer-events: none;
  }
  #empty-state.visible { display: flex; }
  #empty-state .icon { font-size: 2.4rem; opacity: 0.5; }
  #empty-state p { margin: 0; font-size: 0.85rem; max-width: 220px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.02em; }
  .field input, .field select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.88rem;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .field input:hover, .field select:hover { border-color: var(--muted-2); }
  .field input:focus, .field select:focus { border-color: var(--accent); background: var(--panel-3); outline: none; }

  .speaker-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius);
    background: var(--panel-2);
    margin-bottom: 6px;
    border-left: 3px solid transparent;
    transition: background-color 0.15s ease, border-left-color 0.15s ease, transform 0.1s ease;
  }
  .speaker-row:hover { background: var(--panel-3); transform: translateX(2px); }
  .speaker-row.online { border-left-color: var(--online); }
  .speaker-row.offline { border-left-color: var(--offline); }
  .speaker-row.unavailable { border-left-color: var(--unavailable); }
  .speaker-row .name { font-weight: 600; font-size: 0.85rem; }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.online { background: var(--online); box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.18); animation: pulse-online 2.4s ease-in-out infinite; }
  .dot.offline { background: var(--offline); }
  .dot.unavailable { background: var(--unavailable); box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.18); }

  @keyframes pulse-online {
    0%, 100% { box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.18); }
    50% { box-shadow: 0 0 0 5px rgba(76, 175, 80, 0.06); }
  }

  .speaker-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

  .badge {
    font-size: 0.66rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--panel-3);
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  #status-bar {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(15, 18, 22, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    z-index: 2;
  }
  #status-bar::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--unavailable);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }
  #status-bar.live::before { background: var(--online); box-shadow: 0 0 6px var(--online); }
  #status-bar.live { color: var(--text); }

  .legend { display: flex; gap: 14px; font-size: 0.72rem; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 5px; }

  hr.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  @media (max-width: 900px) {
    #layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: auto; min-height: 100vh; }
    #canvas-wrap { padding: 16px; }
  }
</style>
</head>
<body>
<div id="layout">
  <div class="panel">
    <h2>Rooms</h2>
    <div id="room-list"></div>
    <div class="toolbar">
      <button id="new-room" class="primary">+ Room</button>
    </div>
    <h2 style="margin-top:20px">Room Layout</h2>
    <div class="field"><label>Name</label><input id="room-name" /></div>
    <div class="field"><label>Width (m)</label><input id="room-width" type="number" step="0.1" min="1" /></div>
    <div class="field"><label>Height (m)</label><input id="room-height" type="number" step="0.1" min="1" /></div>
    <button id="save-room" class="primary" style="width:100%">Save Room</button>
  </div>

  <div id="canvas-wrap">
    <div id="status-bar">disconnected</div>
    <canvas id="canvas" width="760" height="600"></canvas>
    <div id="empty-state">
      <div class="icon">🏠</div>
      <p>No room selected. Create a room on the left to start placing speakers.</p>
    </div>
  </div>

  <div class="panel" style="border-right:none; border-left:1px solid var(--border)">
    <h2>Speakers <span class="badge" id="speaker-count">0</span></h2>
    <div id="speaker-list"></div>
    <div class="legend">
      <span><i class="dot online"></i>online</span>
      <span><i class="dot offline"></i>offline</span>
      <span><i class="dot unavailable"></i>unavailable</span>
    </div>
    <hr class="divider" />
    <h2>Listener</h2>
    <p class="speaker-meta">Drag the cyan marker on the canvas, or click anywhere in the room, to set the tracked listener position and trigger a spatial DSP recompute.</p>
  </div>
</div>

<script>
const PX_PER_METER = 90;
let state = { rooms: [], speakers: [], lights: [], app_state: {} };
let activeRoomId = null;
let dragging = null; // {type: 'speaker'|'listener', id}

const $ = (sel) => document.querySelector(sel);
const canvas = $('#canvas');
const ctx = canvas.getContext('2d');

function apiUrl(path) { return path; } // ingress-relative

async function api(method, path, body) {
  const res = await fetch(apiUrl(path), {
    method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $('#status-bar').textContent = 'live'; $('#status-bar').classList.add('live'); };
  ws.onclose = () => {
    $('#status-bar').textContent = 'reconnecting…';
    $('#status-bar').classList.remove('live');
    setTimeout(connectWS, 1500);
  };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'snapshot') {
      state = msg.data;
      if (!activeRoomId && state.rooms.length) activeRoomId = state.rooms[0].id;
      renderAll();
    } else if (msg.type === 'db_event') {
      applyEvent(msg);
      renderAll();
    }
  };
}

function applyEvent(evt) {
  const { table, op, row } = evt;
  const listKey = table; // rooms | speakers | lights | app_state
  if (table === 'app_state') { state.app_state = row; return; }
  const list = state[listKey] || [];
  if (op === 'delete') {
    state[listKey] = list.filter((r) => r.id !== row.id);
    return;
  }
  const idx = list.findIndex((r) => r.id === row.id);
  if (idx >= 0) list[idx] = row; else list.push(row);
  state[listKey] = list;
}

function currentRoom() { return state.rooms.find((r) => r.id === activeRoomId); }

function renderAll() {
  renderRoomList();
  renderRoomForm();
  renderSpeakerList();
  renderCanvas();
}

function renderRoomList() {
  const el = $('#room-list');
  el.innerHTML = '';
  state.rooms.forEach((room) => {
    const div = document.createElement('div');
    div.className = 'room-item' + (room.id === activeRoomId ? ' active' : '');
    const count = state.speakers.filter((s) => s.room_id === room.id).length;
    div.innerHTML = `<span>${room.name}</span><small>${count} spk</small><button class="room-delete" title="Delete room">&times;</button>`;
    div.querySelector('span').onclick = div.querySelector('small').onclick = () => { activeRoomId = room.id; renderAll(); };
    div.querySelector('.room-delete').onclick = async (evt) => {
      evt.stopPropagation();
      if (!confirm(`Delete room "${room.name}"? Any speakers in it will be unassigned, not deleted.`)) return;
      await api('DELETE', `/api/rooms/${room.id}`);
      state.rooms = state.rooms.filter((r) => r.id !== room.id);
      if (activeRoomId === room.id) activeRoomId = state.rooms[0]?.id || null;
      renderAll();
    };
    el.appendChild(div);
  });
}

function renderRoomForm() {
  const room = currentRoom();
  $('#room-name').value = room ? room.name : '';
  $('#room-width').value = room ? room.width_meters : 4;
  $('#room-height').value = room ? room.height_meters : 4;
}

function renderSpeakerList() {
  const list = state.speakers.filter((s) => s.room_id === activeRoomId);
  $('#speaker-count').textContent = list.length;
  const el = $('#speaker-list');
  el.innerHTML = '';
  list.forEach((s) => {
    const row = document.createElement('div');
    row.className = `speaker-row ${s.status}`;
    row.innerHTML = `<span class="dot ${s.status}"></span>
      <div style="flex:1">
        <div class="name">${s.name}</div>
        <div class="speaker-meta">${s.ip_address}:${s.port} · gain ${Number(s.gain_db).toFixed(1)}dB · delay ${Number(s.delay_ms).toFixed(0)}ms</div>
        <div class="speaker-meta">
          manual delay <input type="number" class="delay-input" step="1" value="${Number(s.extra_delay_ms || 0).toFixed(0)}" style="width:60px" /> ms
        </div>
      </div>`;
    const input = row.querySelector('.delay-input');
    input.onchange = () => api('POST', `/api/speakers/${s.id}/calibration`, { extra_delay_ms: parseFloat(input.value) || 0 });
    el.appendChild(row);
  });
}

function roomToCanvasScale(room) {
  const w = room.width_meters * PX_PER_METER;
  const h = room.height_meters * PX_PER_METER;
  canvas.width = Math.max(200, w);
  canvas.height = Math.max(200, h);
  return { w, h };
}

function statusColor(status) {
  return status === 'online' ? '#4caf50' : status === 'unavailable' ? '#e53935' : '#616161';
}

function renderCanvas() {
  const room = currentRoom();
  const empty = $('#empty-state');
  if (!room) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.visibility = 'hidden';
    empty.classList.add('visible');
    return;
  }
  canvas.style.visibility = 'visible';
  empty.classList.remove('visible');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  roomToCanvasScale(room);

  // room border
  ctx.strokeStyle = '#3a4552';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

  // listener position
  const as = state.app_state || {};
  if (as.current_room_id === room.id) {
    const lx = as.listener_x * PX_PER_METER, ly = as.listener_y * PX_PER_METER;
    ctx.beginPath();
    ctx.arc(lx, ly, 10, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(79,195,247,0.25)';
    ctx.fill();
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#4fc3f7';
    ctx.font = '10px sans-serif';
    ctx.fillText('listener', lx + 12, ly + 4);
  }

  // speakers
  state.speakers.filter((s) => s.room_id === room.id).forEach((s) => {
    const x = s.pos_x * PX_PER_METER, y = s.pos_y * PX_PER_METER;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((s.orientation_deg * Math.PI) / 180);
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(9, 9);
    ctx.lineTo(-9, 9);
    ctx.closePath();
    ctx.fillStyle = statusColor(s.status);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#cfd8e3';
    ctx.font = '11px sans-serif';
    ctx.fillText(s.name, x + 14, y + 4);
  });
}

function canvasToMeters(evt) {
  const rect = canvas.getBoundingClientRect();
  const px = evt.clientX - rect.left, py = evt.clientY - rect.top;
  return { x: px / PX_PER_METER, y: py / PX_PER_METER };
}

function hitTestSpeaker(mx, my) {
  const room = currentRoom();
  if (!room) return null;
  return state.speakers.find((s) => s.room_id === room.id && Math.hypot(s.pos_x - mx, s.pos_y - my) < 0.22);
}

canvas.addEventListener('mousedown', (evt) => {
  const { x, y } = canvasToMeters(evt);
  const speaker = hitTestSpeaker(x, y);
  if (speaker) {
    dragging = { type: 'speaker', id: speaker.id };
  } else {
    dragging = { type: 'listener' };
    api('POST', '/api/listener-position', { room_id: activeRoomId, x, y });
  }
});

canvas.addEventListener('mousemove', (evt) => {
  if (!dragging) return;
  const { x, y } = canvasToMeters(evt);
  if (dragging.type === 'speaker') {
    const s = state.speakers.find((sp) => sp.id === dragging.id);
    if (s) { s.pos_x = x; s.pos_y = y; renderCanvas(); }
  } else if (dragging.type === 'listener') {
    state.app_state = { ...state.app_state, current_room_id: activeRoomId, listener_x: x, listener_y: y };
    renderCanvas();
  }
});

window.addEventListener('mouseup', () => {
  if (!dragging) return;
  if (dragging.type === 'speaker') {
    const s = state.speakers.find((sp) => sp.id === dragging.id);
    if (s) api('POST', `/api/speakers/${s.id}/position`, { pos_x: s.pos_x, pos_y: s.pos_y, orientation_deg: s.orientation_deg });
  } else if (dragging.type === 'listener') {
    const as = state.app_state;
    api('POST', '/api/listener-position', { room_id: activeRoomId, x: as.listener_x, y: as.listener_y });
  }
  dragging = null;
});

$('#new-room').onclick = async () => {
  const room = await api('POST', '/api/rooms', { name: 'New Room', width_meters: 4, height_meters: 4 });
  activeRoomId = room.id;
};

$('#save-room').onclick = async () => {
  const room = await api('POST', '/api/rooms', {
    id: activeRoomId,
    name: $('#room-name').value,
    width_meters: parseFloat($('#room-width').value),
    height_meters: parseFloat($('#room-height').value),
  });
  // Without this, activeRoomId stays whatever it was before the save (often
  // null, e.g. when a room is created by typing straight into the form
  // instead of clicking "+ New Room" first) and every subsequent save POSTs
  // with a missing/stale id, so the backend upsert mints a brand-new room
  // each time instead of updating the one just saved.
  activeRoomId = room.id;
  renderRoomList();
};

connectWS();
</script>
</body>
</html>
